[project]
name = "kripto_bot"
version = "0.1.0"
description = "ICT scalping signal bot with paper trading (Binance USDT-M futures)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "isamurat233", email = "isamurat233@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    # Data & DataFrame
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    # Exchange / market data
    "ccxt>=4.3",
    "websockets>=12.0",
    "httpx>=0.27",
    # Notify
    "python-telegram-bot>=21.0",
    # Scheduling / async
    "apscheduler>=3.10",
    # Config / settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    # Logging
    "loguru>=0.7",
    # CLI
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

backtest = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
]

[project.scripts]
kripto-bot = "src.main:app"
kripto-bot-download = "src.data.downloader:app"
kripto-bot-backtest = "src.backtest.runner:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
