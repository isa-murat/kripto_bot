# Genel bot ayarları. Sırrlar .env'de tutulur, bu dosya repo'ya commit edilir.

exchange:
  name: binance
  market_type: usdm   # USDT-M perpetual futures

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT

timeframes:
  entry: 15m           # Run22 pivot: 5m → 15m (LTF entry)
  bias: 1h             # HTF bias timeframe (unchanged)
  trigger: 1m          # Hassas tetikleme/MSS doğrulama (opsiyonel)

data:
  # Live veri kaynağı: 'websocket' | 'rest_polling'
  # Binance Futures WS bölgesel filter sebebiyle MVP'de rest_polling kullanılıyor (ADR-0009)
  source: rest_polling
  # REST polling: bar close + N sn sonra fetch
  poll_delay_seconds: 5
  # OHLCV hot buffer'da tutulan mum sayısı
  hot_buffer_size: 500
  # Tarihsel veri için varsayılan başlangıç
  history_start: "2025-11-01"
  # Parquet dosya bölümleme: günlük
  parquet_partition: daily

scheduler:
  daily_report_time: "23:00"   # TR saati
  reconnect_backoff_initial: 1.0
  reconnect_backoff_max: 60.0

telegram:
  rate_limit_per_second: 1
  send_daily_summary: true
  send_signals: true
  send_entries: true
  send_exits: true

paper:
  fee_taker: 0.0004        # Binance default 0.04%
  fee_maker: 0.0002
  slippage_ticks: 1        # Spread + 1 tick ek slippage
  max_concurrent_positions: 3
  risk_per_trade_pct: 0.01 # equity'nin %1'i
  # PENDING entry için bu kadar entry-TF bar bekle. 24 × 5m = 120 dk.
  # run8 loglarında 18 sinyalin 11'i TTL'den expire oldu; ICT setup'larının
  # çoğunlukla 1-2 saat içinde retest aldığı gerçeğine göre gevşetildi.
  # Price-based invalidation yanlış kalanları zaten temizliyor.
  pending_ttl_bars: 24

filters:
  # Aynı sembolde iki sinyal arası minimum süre
  cooldown_minutes: 30
  # Killzone'lar UTC saatiyle. ICT konvansiyonu UTC bazlı; London/NY'de DST
  # değişiyor ama UTC pencereleri sabit kalır.
  killzones:
    - name: london
      start_utc: "07:00"
      end_utc: "10:00"
      enabled: true
    - name: new_york
      start_utc: "12:00"
      end_utc: "15:00"
      enabled: true
    - name: london_ny_overlap
      start_utc: "13:00"
      end_utc: "15:00"
      enabled: false      # NY zaten kapsıyor, ayrıca etiketleme için tutuyoruz
    - name: asia
      start_utc: "00:00"
      end_utc: "04:00"
      enabled: false      # default off — backtest'te ayrıca etkisi ölçülecek
  # HTF regime gate (analysis/trend_classifier kullanır).
  # multi_run1 bulgusu: ranging regime toplam zararın %77'sini üretti.
  # Run22 pivot: regime HTF 4h → 1h, classification_lookback 20 → 30
  # (1h'de 30 bar = 30 saat, 4h'de 20 bar = 80 saat'e yakın window).
  regime_filter:
    enabled: true
    exclude_ranging: true
    exclude_trending: false     # trending şimdilik açık
    htf_timeframe: 1h
    classification_lookback: 30

logging:
  level: INFO
  rotation: "100 MB"
  retention: "14 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
